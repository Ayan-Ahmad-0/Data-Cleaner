
  <!DOCTYPE html>
  <html>
  <head>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>body { background: #09090b; padding: 20px; font-family: Segoe UI, sans-serif; }</style>
  </head>
  <body>
    
    <div style="background: #18181b; padding: 16px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #27272a;">
      <h3 style="color: #f8fafc; margin: 0 0 10px 0; font-family: Segoe UI, sans-serif; font-size: 14px;">Power BI Blue (Dark Mode)</h3>
      <div id="chart_Power_BI_Blue__Dark_Mode_" style="width: 720px; height: 260px;"></div>
    </div>
  
    
    <div style="background: #ffffff; padding: 16px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0;">
      <h3 style="color: #0f172a; margin: 0 0 10px 0; font-family: Segoe UI, sans-serif; font-size: 14px;">Power BI Blue (Light Mode)</h3>
      <div id="chart_Power_BI_Blue__Light_Mode_" style="width: 720px; height: 260px;"></div>
    </div>
  
    
    <div style="background: #18181b; padding: 16px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #27272a;">
      <h3 style="color: #f8fafc; margin: 0 0 10px 0; font-family: Segoe UI, sans-serif; font-size: 14px;">Emerald Green (Dark Mode)</h3>
      <div id="chart_Emerald_Green__Dark_Mode_" style="width: 720px; height: 260px;"></div>
    </div>
  
    
    <div style="background: #ffffff; padding: 16px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0;">
      <h3 style="color: #0f172a; margin: 0 0 10px 0; font-family: Segoe UI, sans-serif; font-size: 14px;">Amber Gold (Light Mode)</h3>
      <div id="chart_Amber_Gold__Light_Mode_" style="width: 720px; height: 260px;"></div>
    </div>
  
    <script>
      const xSet = ['CAD', 'AUD', 'EUR', 'GBP', 'USD'];
      const ySet = ['completed', 'pending', 'failed', 'refunded'];
      const zMatrix = [
        [2235, 2240, 2160, 2210, 2225],
        [2220, 2150, 2228, 2215, 2230],
        [2215, 2232, 2145, 2131, 2220],
        [2242, 2225, 2140, 2220, 2218],
      ];
      const textMatrix = zMatrix.map(row => row.map(v => Number(v).toLocaleString()));

      function render(id, scale, isDark) {
        Plotly.newPlot(id, [{
          type: 'heatmap',
          x: xSet,
          y: ySet,
          z: zMatrix,
          text: textMatrix,
          texttemplate: '<b>%{text}</b>',
          textfont: { family: 'Segoe UI, sans-serif', size: 12 },
          xgap: 3,
          ygap: 3,
          colorscale: scale,
          colorbar: {
            thickness: 12,
            len: 0.82,
            outlinewidth: 0,
            tickfont: { color: isDark ? '#94a3b8' : '#64748b', size: 10, family: 'Segoe UI, sans-serif' },
            tickformat: ',d',
            xpad: 10,
          },
          hovertemplate: '<b>%{y}</b> • <b>%{x}</b><br>Count: <b>%{z:,.0f}</b><extra></extra>',
        }], {
          paper_bgcolor: 'transparent',
          plot_bgcolor: 'transparent',
          margin: { l: 85, r: 20, t: 10, b: 40 },
          xaxis: {
            tickfont: { color: isDark ? '#cbd5e1' : '#334155', size: 11, family: 'Segoe UI, sans-serif' },
            showgrid: false,
            zeroline: false,
            ticks: '',
          },
          yaxis: {
            autorange: 'reversed',
            tickfont: { color: isDark ? '#cbd5e1' : '#334155', size: 11, family: 'Segoe UI, sans-serif' },
            showgrid: false,
            zeroline: false,
            ticks: '',
          },
        }, { responsive: true, displayModeBar: false });
      }

      render('chart_Power_BI_Blue__Dark_Mode_', [
        [0, '#132238'], [0.25, '#17365d'], [0.55, '#1a569b'], [0.8, '#0d6efd'], [1.0, '#38bdf8']
      ], true);

      render('chart_Power_BI_Blue__Light_Mode_', [
        [0, '#ebf3fc'], [0.3, '#9ec5f7'], [0.65, '#3b8ded'], [1.0, '#005fb8']
      ], false);

      render('chart_Emerald_Green__Dark_Mode_', [
        [0, '#0f231c'], [0.3, '#064e3b'], [0.65, '#059669'], [1.0, '#34d399']
      ], true);

      render('chart_Amber_Gold__Light_Mode_', [
        [0, '#fffbeb'], [0.3, '#fde68a'], [0.65, '#f59e0b'], [1.0, '#b45309']
      ], false);
    </script>
  </body>
  </html>
