
  <!DOCTYPE html>
  <html>
  <head>
    <meta charset="utf-8"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background: #0f172a; padding: 40px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; gap: 30px; }
    </style>
  </head>
  <body>
    <!-- Light Mode Container (like screenshot) -->
    <div class="w-[276px] p-3.5 bg-white border border-zinc-200 rounded-2xl shadow-2xl space-y-3 select-none">
      <!-- 1. 2D SV Canvas -->
      <div class="relative w-full h-36 rounded-xl overflow-hidden cursor-crosshair shadow-inner"
        style="background-color: hsl(243, 100%, 50%); background-image: linear-gradient(to top, #000000, transparent), linear-gradient(to right, #ffffff, transparent);">
        <div class="absolute w-4 h-4 rounded-full border-2 border-white shadow-md pointer-events-none -translate-x-1/2 -translate-y-1/2"
          style="left: 69.4%; top: 10.2%; background-color: #4F46E5;"></div>
      </div>

      <!-- 2. Hue Rainbow Slider -->
      <div class="relative w-full h-3 rounded-full cursor-pointer shadow-xs"
        style="background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);">
        <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 rounded-full border-2 border-white shadow-md pointer-events-none"
          style="left: 67.5%; background-color: hsl(243, 100%, 50%);"></div>
      </div>

      <!-- 3. Alpha Slider -->
      <div class="relative w-full h-3 rounded-full cursor-pointer shadow-xs overflow-hidden"
        style="background-image: linear-gradient(to right, transparent, #4F46E5), repeating-conic-gradient(#cbd5e1 0% 25%, #ffffff 0% 50%); background-size: 100% 100%, 8px 8px;">
        <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 rounded-full border-2 border-white shadow-md pointer-events-none"
          style="left: 100%; background-color: #4F46E5;"></div>
      </div>

      <!-- 4. Format & Value Inputs Row -->
      <div class="flex items-center gap-2 pt-0.5">
        <div class="flex items-center justify-between gap-1 px-2.5 py-1.5 rounded-lg border border-zinc-200 bg-zinc-50 text-xs font-semibold text-zinc-700 shrink-0">
          <span>HEX</span>
          <svg class="w-3 h-3 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
        </div>
        <div class="flex-1 flex items-center px-2 py-1.5 rounded-lg border border-zinc-200 bg-zinc-50 text-xs font-mono text-zinc-800">
          <span class="text-zinc-400 font-semibold select-none mr-1.5">#</span>
          <span class="w-full uppercase font-mono tracking-wider text-xs">4F46E5</span>
        </div>
        <div class="w-16 flex items-center justify-center px-2 py-1.5 rounded-lg border border-zinc-200 bg-zinc-50 text-xs font-mono text-zinc-800">
          <span>100%</span>
        </div>
      </div>

      <!-- 5. Saved Colors Section -->
      <div class="pt-1 border-t border-zinc-100 space-y-2">
        <div class="flex items-center justify-between text-xs">
          <span class="font-semibold text-zinc-700">Saved colors:</span>
          <span class="text-xs font-medium text-blue-600 cursor-pointer">+ Add</span>
        </div>
        <div class="grid grid-cols-7 gap-2 pt-0.5">
          <div class="w-7 h-7 rounded-full bg-[#EF4444]"></div>
          <div class="w-7 h-7 rounded-full bg-[#F97316]"></div>
          <div class="w-7 h-7 rounded-full bg-[#EAB308]"></div>
          <div class="w-7 h-7 rounded-full bg-[#22C55E]"></div>
          <div class="w-7 h-7 rounded-full bg-[#06B6D4]"></div>
          <div class="w-7 h-7 rounded-full bg-[#3B82F6]"></div>
          <div class="w-7 h-7 rounded-full bg-[#4F46E5] ring-2 ring-offset-2 ring-zinc-500 ring-offset-white scale-105"></div>
          <div class="w-7 h-7 rounded-full bg-[#EC4899]"></div>
          <div class="w-7 h-7 rounded-full bg-[#E11D48]"></div>
          <div class="w-7 h-7 rounded-full bg-[#D946EF]"></div>
          <div class="w-7 h-7 rounded-full bg-[#8B5CF6]"></div>
          <div class="w-7 h-7 rounded-full bg-[#0284C7]"></div>
          <div class="w-7 h-7 rounded-full bg-[#059669]"></div>
          <div class="w-7 h-7 rounded-full bg-[#84CC16]"></div>
        </div>
      </div>
    </div>

    <!-- Dark Mode Container -->
    <div class="w-[276px] p-3.5 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl space-y-3 select-none text-zinc-100">
      <div class="relative w-full h-34 rounded-xl overflow-hidden cursor-crosshair shadow-inner"
        style="background-color: hsl(243, 100%, 50%); background-image: linear-gradient(to top, #000000, transparent), linear-gradient(to right, #ffffff, transparent);">
        <div class="absolute w-4 h-4 rounded-full border-2 border-white shadow-md pointer-events-none -translate-x-1/2 -translate-y-1/2"
          style="left: 69.4%; top: 10.2%; background-color: #4F46E5;"></div>
      </div>

      <div class="relative w-full h-3 rounded-full cursor-pointer shadow-xs"
        style="background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);">
        <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 rounded-full border-2 border-white shadow-md pointer-events-none"
          style="left: 67.5%; background-color: hsl(243, 100%, 50%);"></div>
      </div>

      <div class="relative w-full h-3 rounded-full cursor-pointer shadow-xs overflow-hidden"
        style="background-image: linear-gradient(to right, transparent, #4F46E5), repeating-conic-gradient(#cbd5e1 0% 25%, #ffffff 0% 50%); background-size: 100% 100%, 8px 8px;">
        <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 rounded-full border-2 border-white shadow-md pointer-events-none"
          style="left: 100%; background-color: #4F46E5;"></div>
      </div>

      <div class="flex items-center gap-2 pt-0.5">
        <div class="flex items-center justify-between gap-1 px-2.5 py-1.5 rounded-lg border border-zinc-800 bg-zinc-950 text-xs font-semibold text-zinc-300 shrink-0">
          <span>HEX</span>
          <svg class="w-3 h-3 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
        </div>
        <div class="flex-1 flex items-center px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-950 text-xs font-mono text-zinc-200">
          <span class="text-zinc-500 font-semibold select-none mr-1.5">#</span>
          <span class="w-full uppercase font-mono tracking-wider text-xs">4F46E5</span>
        </div>
        <div class="w-16 flex items-center justify-center px-2 py-1.5 rounded-lg border border-zinc-800 bg-zinc-950 text-xs font-mono text-zinc-200">
          <span>100%</span>
        </div>
      </div>

      <div class="pt-1 border-t border-zinc-800/80 space-y-2">
        <div class="flex items-center justify-between text-xs">
          <span class="font-semibold text-zinc-300">Saved colors:</span>
          <span class="text-xs font-medium text-blue-400 cursor-pointer">+ Add</span>
        </div>
        <div class="grid grid-cols-7 gap-2 pt-0.5">
          <div class="w-7 h-7 rounded-full bg-[#EF4444]"></div>
          <div class="w-7 h-7 rounded-full bg-[#F97316]"></div>
          <div class="w-7 h-7 rounded-full bg-[#EAB308]"></div>
          <div class="w-7 h-7 rounded-full bg-[#22C55E]"></div>
          <div class="w-7 h-7 rounded-full bg-[#06B6D4]"></div>
          <div class="w-7 h-7 rounded-full bg-[#3B82F6]"></div>
          <div class="w-7 h-7 rounded-full bg-[#4F46E5] ring-2 ring-offset-2 ring-zinc-400 ring-offset-zinc-900 scale-105"></div>
          <div class="w-7 h-7 rounded-full bg-[#EC4899]"></div>
          <div class="w-7 h-7 rounded-full bg-[#E11D48]"></div>
          <div class="w-7 h-7 rounded-full bg-[#D946EF]"></div>
          <div class="w-7 h-7 rounded-full bg-[#8B5CF6]"></div>
          <div class="w-7 h-7 rounded-full bg-[#0284C7]"></div>
          <div class="w-7 h-7 rounded-full bg-[#059669]"></div>
          <div class="w-7 h-7 rounded-full bg-[#84CC16]"></div>
        </div>
      </div>
    </div>
  </body>
  </html>
