<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/datamorph-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/datamorph-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datamorph — Transform • Clean • Prepare • Visualize</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('datamorph-theme') || localStorage.getItem('cleanflow-theme');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
