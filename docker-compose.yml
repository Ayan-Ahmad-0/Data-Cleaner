services:
  data-cleaner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-cleaner-app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DUCKDB_MEMORY_LIMIT=4GB
      - DUCKDB_THREADS=4
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
