services:
  data-cleaner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-cleaner-app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-}
      - DUCKDB_TEMP_DIRECTORY=/app/data/duckdb_temp
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: datamorph-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - data-cleaner

volumes:
  caddy_data:
  caddy_config:
